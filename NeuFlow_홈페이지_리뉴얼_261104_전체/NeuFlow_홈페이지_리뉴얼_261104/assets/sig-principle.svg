<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="title desc">
<title id="title">혈관벽과 영상 신호강도 변화의 개념</title><desc id="desc">혈관벽을 따라 흐르는 혈류와 벽 경계 부근의 두 영상 신호 지점을 표시한 개념도. 직접 전단응력이나 혈관 반응성을 측정한 결과가 아닙니다.</desc>
